[package]
name = "mosh-client"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "An independent, unofficial, wire-compatible Mosh client implementation in Rust"
readme = "README.md"
repository = "https://github.com/wandcs/mosh-client-rs"
keywords = ["mosh", "terminal", "udp", "roaming"]
categories = ["network-programming"]
publish = ["crates-io"]

[lib]
path = "src/lib.rs"

[dependencies]
aes = { version = "=0.9.1", features = ["zeroize"] }
base64 = { version = "0.23.1", default-features = false }
ocb3 = { version = "0.2.0", default-features = false }
miniz_oxide = { version = "=0.9.1", default-features = false, features = ["with-alloc"] }
prost = { version = "=0.14.4", default-features = false, features = ["derive", "std"] }
tokio = { version = "1", default-features = false, features = ["net", "rt", "sync", "time"] }
unicode-width = { version = "=0.2.2", default-features = false }
vt100 = "=0.16.2"
vte = "=0.15.0"
zeroize = { version = "1.9.0", default-features = false }

[dev-dependencies]
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }

[lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
